<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="bullGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00d9f5" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Filters & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="lightGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.25; }
        50% { transform: scale(1.18); opacity: 0.45; }
      }
      @keyframes waveFlow {
        0% { transform: translateX(0); }
        50% { transform: translateX(-40px); }
        100% { transform: translateX(0); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes candleGlow {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -120; }
      }
      .anim-orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 150px; }
      .anim-orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
      .anim-wave { animation: waveFlow 12s ease-in-out infinite; }
      .anim-float1 { animation: floatSlow 6s ease-in-out infinite; }
      .anim-float2 { animation: floatReverse 7s ease-in-out infinite; }
      .candlestick { animation: candleGlow 4s ease-in-out infinite; }
      .dash-flow { stroke-dasharray: 8 6; animation: dashAnim 20s linear infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glowing Background Orbs -->
  <circle class="anim-orb-1" cx="220" cy="120" r="180" fill="#00f2fe" filter="url(#glow)" />
  <circle class="anim-orb-2" cx="980" cy="300" r="220" fill="#7928ca" filter="url(#glow)" />
  <circle class="anim-orb-1" cx="600" cy="390" r="160" fill="#00f5a0" filter="url(#glow)" opacity="0.15" />

  <!-- Background Dynamic Candlestick Chart Silhouette -->
  <g opacity="0.3" class="candlestick">
    <!-- Candle 1 -->
    <line x1="860" y1="210" x2="860" y2="330" stroke="#00f5a0" stroke-width="2" />
    <rect x="852" y="240" width="16" height="60" rx="3" fill="#00f5a0" />
    <!-- Candle 2 -->
    <line x1="910" y1="180" x2="910" y2="310" stroke="#ff4d4d" stroke-width="2" />
    <rect x="902" y="220" width="16" height="70" rx="3" fill="#ff4d4d" />
    <!-- Candle 3 -->
    <line x1="960" y1="140" x2="960" y2="280" stroke="#00f5a0" stroke-width="2" />
    <rect x="952" y="160" width="16" height="85" rx="3" fill="#00f5a0" />
    <!-- Candle 4 -->
    <line x1="1010" y1="110" x2="1010" y2="240" stroke="#00f5a0" stroke-width="2" />
    <rect x="1002" y="130" width="16" height="80" rx="3" fill="#00f5a0" />
    <!-- Candle 5 -->
    <line x1="1060" y1="90" x2="1060" y2="200" stroke="#00f5a0" stroke-width="2" />
    <rect x="1052" y="105" width="16" height="65" rx="3" fill="#00f5a0" />
    <!-- Candle 6 -->
    <line x1="1110" y1="70" x2="1110" y2="180" stroke="#00f5a0" stroke-width="2" />
    <rect x="1102" y="80" width="16" height="70" rx="3" fill="#00f5a0" />
  </g>

  <!-- Background Dynamic Price Wave Trendline -->
  <g class="anim-wave" opacity="0.45">
    <path d="M -50 340 Q 150 280 350 310 T 750 210 T 1050 140 T 1250 80 L 1250 420 L -50 420 Z" fill="url(#bullGrad)" />
    <path d="M -50 340 Q 150 280 350 310 T 750 210 T 1050 140 T 1250 80" fill="none" stroke="#00f5a0" stroke-width="3" filter="url(#lightGlow)" />
  </g>

  <!-- Secondary Dynamic Technical Analysis Line -->
  <path class="dash-flow" d="M 0 380 Q 250 330 500 350 T 900 240 T 1200 130" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.35" />

  <!-- Dynamic Glass Floating Badge Pill 1 (Top Left) -->
  <g class="anim-float1">
    <rect x="80" y="45" width="230" height="38" rx="19" fill="#1e293b" fill-opacity="0.65" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="102" cy="64" r="6" fill="#00f5a0" filter="url(#lightGlow)"/>
    <text x="118" y="69" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">🤖 AI AGENTS &amp; PROMPTS</text>
  </g>

  <!-- Dynamic Glass Floating Badge Pill 2 (Top Right) -->
  <g class="anim-float2">
    <rect x="880" y="45" width="240" height="38" rx="19" fill="#1e293b" fill-opacity="0.65" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
    <circle cx="902" cy="64" r="6" fill="#a855f7" filter="url(#lightGlow)"/>
    <text x="918" y="69" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">⚡ QUANT BACKTESTING</text>
  </g>

  <!-- Foreground Main Title & Core Identity (Crisp, High Contrast, Guaranteed Foreground) -->
  <g>
    <!-- Tagline Pill -->
    <rect x="420" y="95" width="360" height="30" rx="15" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <text x="600" y="115" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED QUANTITATIVE INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="600" y="180" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Financial Analysis &amp; Trading Prompts
    </text>

    <!-- Subtitle -->
    <text x="600" y="222" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="0.2">
      SaaS Platforms • Open-Source Backtesting Engines • Quantitative AI Agents • Pine Script
    </text>
  </g>

  <!-- Feature Highlights Row in Lower Foreground -->
  <g transform="translate(130, 265)">
    <!-- Card 1 -->
    <g class="anim-float1">
      <rect x="0" y="0" width="210" height="68" rx="12" fill="#0b132b" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>
      <text x="18" y="28" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">📈</text>
      <text x="44" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Multi-Asset Backtest</text>
      <text x="18" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">LEAN, Nautilus, VectorBT</text>
    </g>

    <!-- Card 2 -->
    <g class="anim-float2">
      <rect x="240" y="0" width="210" height="68" rx="12" fill="#0b132b" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>
      <text x="258" y="28" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">🧠</text>
      <text x="284" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Financial LLM Agents</text>
      <text x="258" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">TradingAgents, FinGPT, Qlib</text>
    </g>

    <!-- Card 3 -->
    <g class="anim-float1">
      <rect x="480" y="0" width="210" height="68" rx="12" fill="#0b132b" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>
      <text x="498" y="28" fill="#00f5a0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">🌐</text>
      <text x="524" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Institutional Terminals</text>
      <text x="498" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">OpenBB, TradingView, IBKR</text>
    </g>

    <!-- Card 4 -->
    <g class="anim-float2">
      <rect x="720" y="0" width="210" height="68" rx="12" fill="#0b132b" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.5"/>
      <text x="738" y="28" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18">⚡</text>
      <text x="764" y="27" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700">Algorithmic Execution</text>
      <text x="738" y="50" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Freqtrade, CCXT, Alpaca</text>
    </g>
  </g>

  <!-- Subtle Bottom Ambient Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
